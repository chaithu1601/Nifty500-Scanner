name: Run Trading Bot Daily

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI gspread oauth2client

      - name: Create Credentials File
        run: |
          echo '${{ secrets.G_SHEET_CREDS }}' > credentials.json

      - name: Run Trading Bot
        run: python bot.py
