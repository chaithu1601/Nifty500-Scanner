name: Run Trading Bot Daily

on:
  workflow_dispatch: # దీనివల్ల మీరు మొబైల్ నుండి మ్యాన్యువల్ గా రన్ చేసుకోవడానికి బటన్ ఉంటుంది.

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI

      - name: Run Trading Bot
        run: python bot.py
