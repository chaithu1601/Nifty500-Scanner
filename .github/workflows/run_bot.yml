name: Run Trading Bot Daily

on:
  schedule:
    # ప్రతిరోజూ ఇండియా టైమ్ మధ్యాహ్నం 3:00 కి (UTC 09:40) ఆటోమేటిక్‌గా రన్ అవుతుంది
    - cron: '40 9 * * 1-5' 
  workflow_dispatch: # మొబైల్/ల్యాప్‌టాప్ నుండి ఎప్పుడైనా మ్యాన్యువల్ గా రన్ చేయడానికి

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas pyTelegramBotAPI

      - name: Run Bot Script
        run: python bot.py
